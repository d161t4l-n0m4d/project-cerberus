[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerberus"
version = "0.1.0"
description = "Elite Red Team Framework — Clean. Fast. Autonomous. Stealth-by-default."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Cerberus Team" }
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "orjson>=3.9",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
ai = [
    "ollama>=0.3",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
cerberus = "cerberus.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cerberus"]

[tool.ruff]
line-length = 100
target-version = "py311"
